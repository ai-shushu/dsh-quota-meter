# quota-meter bundle patch — applied when this bundle is listed in a profile's
# dsh.profile.bundles, i.e. installed via `dsh plugin --profile <name> add <repo>`.
#
# Single dual-face row resolved from this bundle's package:
#   - node half (index.js): billing (llm/stream) + rejection (agent/pre-step)
#     + /quota HTTP API, served through ctx.webServer
#   - browser half (lib/client.js via exports["./client"], declared dsh.client):
#     progress bar above the input (conversation.input.dock)
#     + exhaustion overlay (shell.overlay)
- insert:
    - id: quota-meter
      name: 'quota-meter'
